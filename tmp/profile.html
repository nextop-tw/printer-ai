<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人資料 — PrinterAI</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="brand-icon" style="width:28px;height:28px;font-size:0.85rem"><i class="bi bi-printer-fill"></i></div>PrinterAI</div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">主選單</div>
      <a href="dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2"></i> 總覽</a>
      <a href="upload.html" class="sidebar-link"><i class="bi bi-cloud-upload"></i> 新增訂單</a>
      <a href="orders.html" class="sidebar-link"><i class="bi bi-box-seam"></i> 我的訂單</a>
      <a href="detect.html" class="sidebar-link"><i class="bi bi-search"></i> 檔案分析</a>
      <div class="sidebar-section">帳號設定</div>
      <a href="profile.html" class="sidebar-link active"><i class="bi bi-person"></i> 個人資料</a>
      <a href="#" class="sidebar-link" data-logout><i class="bi bi-box-arrow-left"></i> 登出</a>
    </nav>
    <div class="sidebar-user"><div class="user-avatar">N</div><div><div class="user-name">nextop</div><div class="user-role">管理員</div></div></div>
  </aside>
  <main class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:0.75rem">
        <button class="sidebar-toggle-btn" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <span class="topbar-greeting"><strong>帳號設定</strong></span>
      </div>
      <div class="topbar-actions"><button class="btn btn-primary btn-sm" id="saveProfileBtn"><i class="bi bi-check-lg"></i> 儲存變更</button></div>
    </div>
    <div style="display:grid;grid-template-columns:280px 1fr;gap:2rem;align-items:start">
      <!-- Avatar Panel -->
      <div class="widget" style="text-align:center">
        <div style="width:80px;height:80px;border-radius:50%;background:var(--accent);color:white;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;margin:0 auto 1rem">N</div>
        <div style="font-weight:700;font-size:1.1rem">nextop</div>
        <div style="font-size:0.82rem;color:var(--muted);margin-bottom:1rem">管理員</div>
        <div style="display:inline-block;background:rgba(232,92,44,0.1);color:var(--accent);padding:4px 12px;border-radius:100px;font-size:0.75rem;font-weight:600;margin-bottom:1.5rem">Pro 方案</div>
        <div style="font-size:0.78rem;color:var(--muted);line-height:1.8">
          <div>加入時間：2025 年 1 月</div>
          <div>累計訂單：47 筆</div>
          <div>已分析檔案：23 個</div>
        </div>
      </div>
      <!-- Form -->
      <div>
        <div class="widget" style="margin-bottom:1.5rem">
          <h4 style="margin-bottom:1.5rem;font-size:1rem">基本資料</h4>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
            <div class="form-group"><label class="form-label">姓名</label><input type="text" class="form-control" value="謙悅科技" /></div>
            <div class="form-group"><label class="form-label">職稱</label><input type="text" class="form-control" value="管理員" /></div>
          </div>
          <div class="form-group"><label class="form-label">電子信箱</label><input type="email" class="form-control" value="admin@nextop.com" /></div>
          <div class="form-group"><label class="form-label">公司名稱</label><input type="text" class="form-control" value="NEXTOP 謙悅科技有限公司" /></div>
          <div class="form-group"><label class="form-label">聯絡電話</label><input type="text" class="form-control" placeholder="+886 04-XXXX-XXXX" /></div>
        </div>
        <div class="widget" style="margin-bottom:1.5rem">
          <h4 style="margin-bottom:1.5rem;font-size:1rem">預設配送地址</h4>
          <div class="form-group"><label class="form-label">地址</label><input type="text" class="form-control" placeholder="街道、路、段、號" /></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
            <div class="form-group"><label class="form-label">城市</label><input type="text" class="form-control" value="台中市" /></div>
            <div class="form-group"><label class="form-label">國家／地區</label>
              <select class="form-control"><option selected>台灣</option><option>香港</option><option>新加坡</option><option>日本</option><option>美國</option></select>
            </div>
          </div>
        </div>
        <div class="widget">
          <h4 style="margin-bottom:1.5rem;font-size:1rem">變更密碼</h4>
          <div class="form-group"><label class="form-label">目前密碼</label><input type="password" class="form-control" placeholder="••••••••" /></div>
          <div class="form-group"><label class="form-label">新密碼</label><input type="password" class="form-control" placeholder="最少 8 個字元" /></div>
          <div class="form-group"><label class="form-label">確認新密碼</label><input type="password" class="form-control" placeholder="再次輸入新密碼" /></div>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="toast-container"></div>
<script src="script.js"></script>
<script>
document.getElementById('saveProfileBtn')?.addEventListener('click', () => {
  Toast.show('個人資料已儲存', 'success');
});
</script>
</body>
</html>

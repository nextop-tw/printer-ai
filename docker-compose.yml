services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: printer_ai_php
    volumes:
      - .:/var/www/html
    networks:
      - printer_ai
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: printer_ai_nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - printer_ai
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: printer_ai_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: printer_ai
      MYSQL_USER: printer_ai
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - printer_ai_mysql:/var/lib/mysql
    networks:
      - printer_ai

networks:
  printer_ai:
    driver: bridge

volumes:
  printer_ai_mysql:
